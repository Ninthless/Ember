name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ninthless/Ember-core
          token: ${{ secrets.CORE_TOKEN }}
          path: ember-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: --win
          - os: macos-latest
            builder: --mac
          - os: ubuntu-latest
            builder: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ninthless/Ember-core
          token: ${{ secrets.CORE_TOKEN }}
          path: ember-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg"

      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Collect release files
        shell: bash
        run: |
          mkdir -p upload
          find release -type f \
            \( -name '*.exe' -o -name '*.exe.blockmap' -o -name '*.dmg' -o -name '*.dmg.blockmap' -o -name '*.zip' -o -name '*.zip.blockmap' -o -name '*.AppImage' -o -name '*.deb' -o -name 'latest*.yml' \) \
            -exec cp {} upload/ \;
          find upload -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: ember-${{ matrix.os }}
          path: upload/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ember-*
          merge-multiple: true
          path: release
      - name: List release files
        run: find release -type f -print
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/*.AppImage
            release/*.deb
            release/latest.yml
            release/latest-mac.yml
            release/latest-linux.yml
          generate_release_notes: true
          body: |
            Windows, macOS, and Linux builds for this tag.

            These files are not code-signed. Windows SmartScreen and macOS Gatekeeper can warn the first time you open them.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
